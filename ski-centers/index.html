<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski Centers Near Slovenia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#15202b; --muted:#5b6b7b; --line:#e3e8ef;
  --accent:#1f6feb; --accent-ink:#fff; --chip:#eef2f7; --chip-on:#1f6feb;
  --si:#1f6feb; --at:#d93636; --it:#1a9e55; --hr:#8a4fd8;
  --shadow:0 6px 24px rgba(15,30,50,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#151d26; --ink:#e6edf3; --muted:#93a4b5; --line:#263241;
  --accent:#4c9aff; --chip:#1e2935; --chip-on:#4c9aff; --shadow:0 6px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#151d26; --ink:#e6edf3; --muted:#93a4b5; --line:#263241;
  --accent:#4c9aff; --chip:#1e2935; --chip-on:#4c9aff; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
#app{display:flex;height:100%}
#side{width:380px;min-width:380px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:500;box-shadow:var(--shadow)}
#map{flex:1;height:100%}
.hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.hd h1{font-size:18px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.hd .sub{color:var(--muted);font-size:12.5px}
.ctrl{padding:8px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;overflow:auto;flex:none;max-height:60%}
.row{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:6px 4px;border-radius:7px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid rgba(255,255,255,.8)}
select,input[type=text]{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.inline{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.status{font-size:12px;color:var(--muted)}.status:empty{display:none}
.status.warn{color:#c77700}
#list{flex:1;overflow:auto}
.lhead{position:sticky;top:0;background:var(--panel);padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;z-index:2}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:hover,.item.sel{background:var(--chip)}
.item .rk{color:var(--muted);font-size:12px;text-align:right}
.item .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.item .mt{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.item .val small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.badge{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--chip);border:1px solid var(--line);font-weight:600}
.b-S{color:#6b7b8c}.b-M{color:#c77700}.b-L{color:#d93636}
.cc{font-weight:700;font-size:11px}
.leaflet-popup-content-wrapper{border-radius:12px}
.pop h3{margin:0 0 2px;font-size:15px}
.pop .reg{color:#667;font-size:12px;margin-bottom:8px}
.pop table{border-collapse:collapse;width:100%;font-size:12.5px}
.pop td{padding:2px 0}.pop td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pop .links{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pop .links a,.pop .links button{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;color:#1f2328;text-decoration:none;cursor:pointer;font-family:inherit}
.pop .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.pop .tag{font-size:11px;background:#eef2f7;color:#334;padding:1px 6px;border-radius:5px}
.legend{background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;line-height:1.5}
.legend .bar{height:8px;width:160px;border-radius:4px;margin:4px 0}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.origin-ic{background:#111;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #111}
.ring-lbl{background:transparent;border:0;box-shadow:none;font-weight:700;color:#223;text-shadow:0 0 3px #fff,0 0 3px #fff;font-size:12px}
#toggleSide{display:none}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;min-width:0;height:55%;order:2;border-right:0;border-top:1px solid var(--line)}
  #map{height:45%;order:1;flex:none}
  .ctrl{max-height:45%}
}
</style>
</head>

<div id="app">
  <aside id="side">
    <div class="hd">
      <h1>Ski centers near Slovenia</h1>
      <div class="sub"><span id="nRes"></span> resorts in SI · AT · IT · HR — road data via OSRM (OpenStreetMap)</div>
    </div>
    <div class="ctrl">
      <div class="row">
        <div class="lbl">Start from</div>

      </div>
      <div class="row">

          <button data-m="time" class="on">Drive time</button>
          <button data-m="value" title="Slope km per hour of driving">Slopes/h</button>

      </div>

        <div class="chips" id="sizeChips">
          <button class="chip on" data-s="all">All</button>
          <button class="chip" data-s="S" title="under 20 km of slopes">Small</button>
          <button class="chip" data-s="M" title="20–60 km of slopes">Medium</button>
          <button class="chip" data-s="L" title="60+ km of slopes">Large</button>
        </div>
      </div>
      <div class="row">
        <div class="lbl">Country</div>

          <button class="chip on" data-c="HR"><span class="dot" style="background:var(--hr)"></span>Croatia</button>
        </div>
      </div>
      <div class="row">
        <div class="lbl">Max drive time <span id="maxLbl" style="text-transform:none;letter-spacing:0"></span></div>
        <input type="range" id="maxT" min="30" max="390" step="15" value="390">
      </div>
      <div class="row">
        <div class="lbl">Show</div>
        <div class="toggles">
          <label><input type="checkbox" id="tRings" checked> Drive-time rings</label>
          <label><input type="checkbox" id="tWinter"> Winter +20% time</label>
          <label><input type="checkbox" id="tGlacier"> Glacier only</label>
          <label><input type="checkbox" id="tNight"> Night skiing</label>
          <label><input type="checkbox" id="tColor"> Color by country</label>
          <label><input type="checkbox" id="tPistes"> Piste overlay</label>
        </div>
      </div>
      <div class="row">
        <div class="inline">
          <input type="text" id="q" placeholder="Search resort or region…">
          <button class="btn" id="snowBtn" title="Current snow depth + 7-day snowfall (Open-Meteo)">❄ Snow</button>
        </div>
      </div>
    </div>
    <div class="lhead"><span id="cnt"></span><span id="sortLbl"></span></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</div>

  rings:true, winter:false, glacier:false, night:false, byCountry:false, pistes:false, q:'',
  sel:null, snow:null
};

try{ const s=JSON.parse(localStorage.getItem('skimap')||'{}');
  ['metric','size','maxT','rings','winter','glacier','night','byCountry','pistes'].forEach(k=>{if(k in s)st[k]=s[k]});
  if(Array.isArray(s.cty))st.cty=new Set(s.cty);
  if(st.maxT>=330)st.maxT=390; // old 'any' value from before the 6 h range
}catch(e){}
function save(){try{localStorage.setItem('skimap',JSON.stringify({metric:st.metric,size:st.size,maxT:st.maxT,rings:st.rings,winter:st.winter,glacier:st.glacier,night:st.night,byCountry:st.byCountry,pistes:st.pistes,cty:[...st.cty]}))}catch(e){}}

// ---------- helpers ----------
const $ = s=>document.querySelector(s);
function hav(a1,o1,a2,o2){const R0=6371,t=Math.PI/180,da=(a2-a1)*t,dl=(o2-o1)*t;const h=Math.sin(da/2)**2+Math.cos(a1*t)*Math.cos(a2*t)*Math.sin(dl/2)**2;return 2*R0*Math.asin(Math.sqrt(h))}
const wf = ()=>st.winter?1.2:1;
function fmtT(min){if(min==null||!isFinite(min))return '–';min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m} min`}
function air(r){return hav(st.origin.lat,st.origin.lon,r.lat,r.lon)}
function tmin(r){const d=road.d[r.i];return d==null?null:d/60*wf()}
function rkm(r){return road.k[r.i]}
function val(r){const t=tmin(r);return t?r.km/(t/60):0}
function metricVal(r){switch(st.metric){case 'air':return air(r);case 'road':return rkm(r);case 'time':return tmin(r);case 'value':return val(r)}}
function fmtMetric(r,m=st.metric){switch(m){case 'air':return air(r).toFixed(0)+' km';case 'road':return rkm(r)==null?'–':(rkm(r)).toFixed(0)+' km';case 'time':return fmtT(tmin(r));case 'value':return val(r).toFixed(0)+' km/h'}}
const est = ()=>road.est?'~':'';

// ---------- colors ----------
const ramp = t=>d3.interpolateRdYlGn(1-Math.max(0,Math.min(1,t))); // 0 good (green) → 1 bad (red)
function domain(){switch(st.metric){case 'air':return [0,300];case 'road':return [0,550];case 'time':return [0,360];case 'value':return [0,60]}}
function colorFor(r){
  if(st.byCountry)return CCOL[r.c];
  const v=metricVal(r);if(v==null)return '#999';const [a,b]=domain();
  let t=(v-a)/(b-a);if(st.metric==='value')t=1-t;return ramp(t);
}
function drawLegend(){
  const el=$('#legend');if(!el)return;
  if(st.byCountry){el.innerHTML='<b>Country</b><br>'+Object.keys(CTY).map(c=>`<span class="dot" style="background:${CCOL[c]}"></span> ${CTY[c]}`).join('<br>')+'<br><span style="color:var(--muted)">circle size = slope km</span>';return}
  const [a,b]=domain();const stops=d3.range(0,1.01,.1).map(t=>ramp(st.metric==='value'?1-t:t)).join(',');
  const lab={air:'Air distance (km)',road:'Road distance (km)',time:'Drive time'+(st.winter?' (winter)':''),value:'Slope km per hour driving'}[st.metric];
  const f=st.metric==='time'?(x=>x/60+'h'):(x=>x);
  let ringsHtml='';
  if(st.rings&&road.grid){ringsHtml='<div style="margin-top:6px"><b>Rings</b>: '+RING_T.map((t,i)=>`<span class="dot" style="background:${RING_C[i]};border-color:#555"></span>${t/60}h`).join(' ')+'</div>'}
  el.innerHTML=`<b>${lab}</b><div class="bar" style="background:linear-gradient(90deg,${stops})"></div><div class="ends"><span>${f(a)}</span><span>${f(b)}+</span></div><div style="color:var(--muted)">circle size = slope km</div>${ringsHtml}`;
}

// ---------- rings (isochrones from grid) ----------
const RING_T=[60,120,180,240,300];
const RING_C=['#2ea043','#9bd35a','#f2cc3d','#f08c2e','#d73a3a'];
function drawRings(){
  ringLayer.clearLayers();
  const g=road.grid; if(!st.rings||!g){drawLegend();return}
  const vals=g.t.map((t,i)=>{if(t==null||t<0)return 9999;const s=g.s[i]||0;if(s>12000)return 9999;return (t+Math.max(0,s-1000)/1000*3)*wf()});
  // relax: a point can't be much slower than its neighbours (+~12 min per 8 km cell) — removes snapping speckles
  for(let pass=0;pass<2;pass++){const v2=vals.slice();
    for(let y=0;y<g.ny;y++)for(let x=0;x<g.nx;x++){const i=y*g.nx+x;let m=v2[i];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=g.nx||yy>=g.ny)continue;
        const c=v2[yy*g.nx+xx]+(dx&&dy?17:12);if(c<m)m=c}
      vals[i]=m}}
  const cs=d3.contours().size([g.nx,g.ny]).smooth(true).thresholds(RING_T)(vals);
  const tr=([x,y])=>[g.lat0+(y-0.5)*g.dy,g.lon0+(x-0.5)*g.dx];
  const flat=c=>c.coordinates.flatMap(poly=>poly.map(ring=>ring.map(tr)));
  const rect=[[0,0],[g.nx,0],[g.nx,g.ny],[0,g.ny]].map(tr);
  // band k = (value >= t[k-1]) minus (value >= t[k]); SVG even-odd fill makes the difference.
  cs.forEach((c,k)=>{
    const prev=k===0?[rect]:flat(cs[k-1]);
    const cur=flat(c);
    L.polygon([...prev,...cur],{pane:'rings',stroke:false,fillColor:RING_C[k],fillOpacity:.16,interactive:false}).addTo(ringLayer);
    cur.forEach(r=>{if(r.length>12)L.polyline(r,{pane:'rings',color:RING_C[k],weight:1.5,opacity:.9,interactive:false}).addTo(ringLayer)});
  });
  drawLegend();
}

// ---------- routing ----------
function setStatus(t,warn){const s=$('#status');s.textContent=t||'';s.className='status'+(warn?' warn':'')}
async function fetchTable(o){
  // OSRM demo server caps table requests at ~100 coordinates, so query in chunks
  const d=[],k=[];
  for(let i=0;i<R.length;i+=90){
    if(i)await new Promise(r=>setTimeout(r,1000));
    const coords=[`${o.lon},${o.lat}`,...R.slice(i,i+90).map(r=>`${r.lon},${r.lat}`)].join(';');
    const j=await fetch(`${OSRM}/table/v1/driving/${coords}?sources=0&annotations=duration,distance`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    if(j.code!=='Ok')throw new Error(j.code);
    d.push(...j.durations[0].slice(1));k.push(...j.distances[0].slice(1).map(x=>x==null?null:x/1000));
  }
  return {d,k,est:false,grid:null};
}
function estimate(o){
  const k=R.map(r=>hav(o.lat,o.lon,r.lat,r.lon)*1.38);
  return {k,d:k.map(x=>x/68*3600),est:true,grid:null};
}
let reqId=0;
async function setOrigin(o){
  st.origin=o;originMarker.setLatLng([o.lat,o.lon]);routeLayer.clearLayers();
  const sel=$('#origin');if(o.key==='custom'){let opt=sel.querySelector('option[value=custom]');if(!opt){opt=document.createElement('option');opt.value='custom';sel.appendChild(opt)}opt.textContent=o.name}
  sel.value=o.key;
  const ck=o.key==='custom'?`c${o.lat.toFixed(3)},${o.lon.toFixed(3)}`:o.key;
  if(cache[ck]){road=cache[ck];afterRoad(ck);return}
  const my=++reqId;road=estimate(o);refresh();setStatus('Getting road distances…');
  try{const t=await fetchTable(o);if(my!==reqId)return;cache[ck]=t;road=t;afterRoad(ck)}
  catch(e){if(my!==reqId)return;cache[ck]=road;setStatus('Routing service unreachable — road km/time are rough estimates (~).',true);refresh();drawRings()}
}
function afterRoad(ck){
  refresh();drawRings();
  if(road.est)setStatus('Road km/time are rough estimates (~) — routing service was unreachable.',true);
  else if(!road.grid)setStatus('');
  else setStatus('');
  updateRingBtn(ck);
}
function updateRingBtn(ck){
  const s=$('#status');
  if(!road.grid&&!road.est&&st.rings){
    s.innerHTML='Rings not computed for this start. <button class="btn" id="ringCalc" style="padding:2px 7px">Compute rings (~40 s)</button>';
    $('#ringCalc').onclick=()=>computeGrid(ck);
  }
}
async function computeGrid(ck){
  const o=st.origin, g0=GRID, pts=[];
  for(let y=0;y<g0.ny;y++)for(let x=0;x<g0.nx;x++)pts.push([+(g0.lon0+x*g0.dx).toFixed(3),+(g0.lat0+y*g0.dy).toFixed(3)]);
  const g={...g0,t:new Array(pts.length),s:new Array(pts.length)};
  const my=reqId;
  for(let i=0;i<pts.length;i+=98){
    if(my!==reqId)return;
    setStatus(`Computing rings… ${Math.round(i/pts.length*100)}%`);
    const ch=pts.slice(i,i+98);let ok=false;
    for(let a=0;a<4&&!ok;a++){try{
      const j=await fetch(`${OSRM}/table/v1/driving/${o.lon},${o.lat};${ch.map(p=>p.join(',')).join(';')}?sources=0`).then(r=>r.json());
      if(j.code!=='Ok')throw 0;
      j.durations[0].slice(1).forEach((d,k)=>{g.t[i+k]=d==null?-1:Math.round(d/60);g.s[i+k]=Math.round(j.destinations[k+1].distance)});ok=true;
    }catch(e){await new Promise(r=>setTimeout(r,2500))}}
    if(!ok){setStatus('Ring computation failed (routing service busy). Try again later.',true);return}
    await new Promise(r=>setTimeout(r,1000));
  }
  cache[ck].grid=g; if(my===reqId){road=cache[ck];setStatus('');drawRings()}
}
async function showRoute(r){
  routeLayer.clearLayers();
  const o=st.origin;
  try{
    const j=await fetch(`${OSRM}/route/v1/driving/${o.lon},${o.lat};${r.lon},${r.lat}?overview=full&geometries=geojson`).then(x=>x.json());
    const co=j.routes[0].geometry.coordinates.map(([x,y])=>[y,x]);
    L.polyline(co,{color:'#fff',weight:8,opacity:.9}).addTo(routeLayer);
    L.polyline(co,{color:'#1f6feb',weight:5,opacity:.95}).addTo(routeLayer);
    map.fitBounds(L.latLngBounds(co).pad(.15),{paddingTopLeft:[0,0]});
  }catch(e){
    L.polyline([[o.lat,o.lon],[r.lat,r.lon]],{color:'#1f6feb',weight:3,dashArray:'6 6'}).addTo(routeLayer);
    setStatus('Could not load the route line (routing service unreachable).',true);
  }
}

// ---------- filtering & rendering ----------
function passes(r){
  if(!st.cty.has(r.c))return false;
  if(st.size!=='all'&&r.size!==st.size)return false;
  if(st.glacier&&!r.tagl.includes('glacier'))return false;
  if(st.night&&!r.tagl.includes('night'))return false;
  const t=tmin(r);if(st.maxT<390&&(t==null||t>st.maxT))return false;
  if(st.q){const q=st.q.toLowerCase();if(!(r.n.toLowerCase().includes(q)||r.reg.toLowerCase().includes(q)||CTY[r.c].toLowerCase().includes(q)))return false}
  return true;
}
function sorted(list){
  const dir=st.metric==='value'?-1:1;
  return list.slice().sort((a,b)=>{const x=metricVal(a),y=metricVal(b);if(x==null)return 1;if(y==null)return -1;return dir*(x-y)});
}
const markers={};
function popupHtml(r){
  const t=tmin(r),sn=st.snow&&st.snow[r.i];
  const links=r.tagl.filter(x=>x.startsWith('link:')).map(x=>x.slice(5));
  const tags=[r.tagl.includes('glacier')&&'🧊 glacier',r.tagl.includes('night')&&'🌙 night skiing',r.tagl.includes('gondola')&&'🚡 gondola/cable car',r.tagl.includes('dolomiti')&&'Dolomiti Superski',r.tagl.includes('sella')&&'Sella Ronda',...links.map(l=>'↔ linked with '+l)].filter(Boolean);
  const g=`https://www.google.com/maps/dir/?api=1&origin=${st.origin.lat},${st.origin.lon}&destination=${r.lat},${r.lon}&travelmode=driving`;
  return `<div class="pop"><h3>${r.n}</h3><div class="reg">${CTY[r.c]} · ${r.reg} · <b>${SIZE_NAME[r.size]}</b></div>
  <table>
  <tr><td>Drive time from ${st.origin.name.replace(/ \(.*/,'')}</td><td>${est()}${fmtT(t)}</td></tr>
  <tr><td>Road distance</td><td>${est()}${rkm(r)==null?'–':rkm(r).toFixed(0)+' km'}</td></tr>
  <tr><td>Air distance</td><td>${air(r).toFixed(0)} km</td></tr>
  <tr><td>Slopes</td><td>${r.km} km</td></tr>
  <tr><td>Lifts</td><td>${r.lifts}</td></tr>
  <tr><td>Altitude</td><td>${r.base} – ${r.top} m</td></tr>
  <tr><td>Vertical drop</td><td>${r.top-r.base} m</td></tr>
  <tr><td>Slope km per hour driving</td><td>${val(r).toFixed(0)}</td></tr>
  ${sn?`<tr><td>Snow depth (modelled, ~${sn.el} m)</td><td>${sn.depth} cm</td></tr><tr><td>Snowfall next 7 days</td><td>${sn.fall} cm</td></tr>`:''}
  </table>
  ${tags.length?`<div class="tags">${tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}
  <div class="links"><button data-route="${r.i}">Show route</button><a href="${g}" target="_blank" rel="noopener">Google Maps</a><a href="${r.url}" target="_blank" rel="noopener">Website</a></div></div>`;
}
map.on('popupopen',e=>{const b=e.popup.getElement().querySelector('[data-route]');if(b)b.onclick=()=>showRoute(R[+b.dataset.route])});

function refresh(){
  const vis=sorted(R.filter(passes));
  markerLayer.clearLayers();
  // draw large first so small ones stay clickable on top
  vis.slice().sort((a,b)=>b.km-a.km).forEach(r=>{
    const col=colorFor(r);
    const m=L.circleMarker([r.lat,r.lon],{radius:4+Math.sqrt(r.km)*1.25,color:st.sel===r.i?'#111':'#fff',weight:st.sel===r.i?3:1.5,fillColor:col,fillOpacity:.92});
    m.bindTooltip(`<b>${r.n}</b><br>${est()}${fmtT(tmin(r))} · ${r.km} km slopes`,{direction:'top',offset:[0,-4]});
    m.bindPopup(()=>popupHtml(r),{maxWidth:300});
    m.on('click',()=>{st.sel=r.i;highlight()});
    m.addTo(markerLayer);markers[r.i]=m;
  });
  // list
  const L2=$('#list');
  const lbl={air:'air km',road:'road km',time:'drive time',value:'slope km / h'}[st.metric];
  $('#cnt').textContent=`${vis.length} of ${R.length} shown`;
  $('#sortLbl').textContent='sorted by '+lbl+(st.metric==='value'?' ↓':' ↑');
  L2.innerHTML=vis.map((r,k)=>{
    const sn=st.snow&&st.snow[r.i];
    const sub=st.metric==='time'?(rkm(r)!=null?est()+rkm(r).toFixed(0)+' km':''):fmtT(tmin(r));
    return `<div class="item${st.sel===r.i?' sel':''}" data-i="${r.i}"><div class="rk">${k+1}</div>
    <div><div class="nm">${r.n}</div><div class="mt"><span class="cc" style="color:${CCOL[r.c]}">${r.c}</span><span class="badge b-${r.size}">${SIZE_NAME[r.size]}</span><span>${r.km} km · ${r.top} m</span>${r.tagl.includes('glacier')?'<span title="glacier">🧊</span>':''}${r.tagl.includes('night')?'<span title="night skiing">🌙</span>':''}${sn?`<span title="snow depth / 7-day snowfall">❄ ${sn.depth} cm${sn.fall?` (+${sn.fall})`:''}</span>`:''}</div></div>
    <div class="val">${st.metric==='air'?'':est()}${fmtMetric(r)}<small>${sub}</small></div></div>`}).join('')||'<div style="padding:20px 16px;color:var(--muted)">No resorts match these filters.</div>';
  $('#nRes').textContent=R.length;
  drawLegend();
}
function highlight(){
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===st.sel));
  Object.entries(markers).forEach(([i,m])=>{if(markerLayer.hasLayer(m))m.setStyle({color:+i===st.sel?'#111':'#fff',weight:+i===st.sel?3:1.5})});
  const el=document.querySelector(`.item[data-i="${st.sel}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
$('#list').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;const r=R[+it.dataset.i];st.sel=r.i;highlight();
  map.flyTo([r.lat,r.lon],Math.max(map.getZoom(),10),{duration:.8});setTimeout(()=>markers[r.i]&&markers[r.i].openPopup(),850)});

// ---------- snow (Open-Meteo) ----------
async function loadSnow(){
  const b=$('#snowBtn');b.textContent='❄ …';
  try{
    const el=R.map(r=>Math.round((r.base+r.top)/2));
    const q=`latitude=${R.map(r=>r.lat).join(',')}&longitude=${R.map(r=>r.lon).join(',')}&elevation=${el.join(',')}`;
    const j=await fetch(`https://api.open-meteo.com/v1/forecast?${q}&current=snow_depth&daily=snowfall_sum&forecast_days=7&timezone=auto`).then(r=>r.json());
    const arr=Array.isArray(j)?j:[j];
    st.snow=arr.map((x,i)=>({depth:Math.round((x.current?.snow_depth||0)*100),fall:Math.round((x.daily?.snowfall_sum||[]).reduce((a,b)=>a+(b||0),0)),el:el[i]}));
    b.textContent='❄ Loaded';setStatus('Snow: modelled depth at mid-mountain + next 7 days snowfall (Open-Meteo).');refresh();
  }catch(e){b.textContent='❄ Snow';setStatus('Could not load snow data (Open-Meteo unreachable).',true)}
}

sel.onchange=()=>{const o=ORIGINS.find(x=>x[0]===sel.value);if(o)setOrigin({key:o[0],name:o[1],lat:o[2],lon:o[3]})};
let picking=false;
$('#pickBtn').onclick=()=>{picking=!picking;map.getContainer().style.cursor=picking?'crosshair':'';$('#pickBtn').classList.toggle('primary',picking);setStatus(picking?'Click on the map to set your start point (or drag the black dot).':'')};
map.on('click',e=>{if(!picking)return;picking=false;map.getContainer().style.cursor='';$('#pickBtn').classList.remove('primary');
  setOrigin({key:'custom',name:`Custom (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`,lat:e.latlng.lat,lon:e.latlng.lng})});
$('#geoBtn').onclick=()=>{if(!navigator.geolocation){setStatus('Geolocation not available.',true);return}
  setStatus('Locating…');navigator.geolocation.getCurrentPosition(p=>setOrigin({key:'custom',name:'My location',lat:p.coords.latitude,lon:p.coords.longitude}),()=>setStatus('Location permission denied.',true))};
function segOn(){document.querySelectorAll('#metricSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.metric))}
$('#metricSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.metric=b.dataset.m;segOn();save();refresh()};
function sizeOn(){document.querySelectorAll('#sizeChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.s===st.size))}
$('#sizeChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.size=b.dataset.s;sizeOn();save();refresh()};
function ctyOn(){document.querySelectorAll('#ctyChips .chip').forEach(b=>b.classList.toggle('on',st.cty.has(b.dataset.c)))}
$('#ctyChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const c=b.dataset.c;
  if(e.shiftKey||e.altKey){st.cty=new Set([c])}else{st.cty.has(c)?st.cty.delete(c):st.cty.add(c)}ctyOn();save();refresh()};
$('#ctyChips').ondblclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.cty=new Set([b.dataset.c]);ctyOn();save();refresh()};
const maxT=$('#maxT');
function maxLbl(){$('#maxLbl').textContent=st.maxT>=390?'any':'≤ '+fmtT(st.maxT)}
maxT.value=st.maxT;maxT.oninput=()=>{st.maxT=+maxT.value;maxLbl();save();refresh()};
const tg={tRings:'rings',tWinter:'winter',tGlacier:'glacier',tNight:'night',tColor:'byCountry',tPistes:'pistes'};
Object.entries(tg).forEach(([id,k])=>{const el=$('#'+id);el.checked=st[k];el.onchange=()=>{st[k]=el.checked;save();
  if(k==='pistes'){st.pistes?pistes.addTo(map):map.removeLayer(pistes);return}
  if(k==='rings'){st.rings?ringLayer.addTo(map):map.removeLayer(ringLayer);drawRings();if(st.rings)updateRingBtn(st.origin.key);return}
  if(k==='winter')drawRings();
  refresh()}});
if(!st.rings)map.removeLayer(ringLayer);
$('#q').oninput=e=>{st.q=e.target.value.trim();refresh()};
$('#snowBtn').onclick=loadSnow;

segOn();sizeOn();ctyOn();maxLbl();
refresh();drawRings();
const fitAll=()=>map.fitBounds(L.latLngBounds(R.map(r=>[r.lat,r.lon])).pad(.05));
if(map.getSize().x)fitAll();else map.once('resize',fitAll); // container may be 0-size when loaded in a hidden tab
})();

</script>
</body>
</html>
